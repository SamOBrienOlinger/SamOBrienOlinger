name: Responsive device checks

on:
  push:
    branches:
      - main
      - portfolio-redesign
      - profesh
  pull_request:
    branches:
      - main
      - portfolio-redesign
      - profesh

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Upload browser checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profesh-browser-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
