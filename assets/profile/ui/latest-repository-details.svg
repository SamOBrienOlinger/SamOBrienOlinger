<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc">
<title id="title">Latest repository details</title>
<desc id="desc">Seven project cards summarize each repository and show its language composition as a color-coded proportional bar with a percentage legend. The palette uses the portfolio's deep navy, pale blue and cyan accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111e2d"/><stop offset="1" stop-color="#172638"/></linearGradient>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#edf4ff"/><stop offset="1" stop-color="#92b8d6"/></linearGradient>
  <style>
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .title{font-size:27px;font-weight:700;fill:#edf4ff}.summary{font-size:16px;fill:#c4d6e8}.label{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#92b8d6}.legend{font-size:12px;fill:#edf4ff}.muted{font-size:13px;fill:#b7d5ed}
    .card{fill:#172638;stroke:#354b60;stroke-width:1.5}.track{fill:#263c50}
  </style>
</defs>
<rect width="1200" height="1190" rx="24" fill="url(#bg)"/>
<text x="38" y="58" font-size="36" font-weight="750" fill="url(#header)">Latest repository details</text>
<text x="40" y="91" font-size="15" fill="#b7d5ed">What each project does · language composition from the featured repositories</text>

